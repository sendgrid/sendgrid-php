name: Test and Deploy
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    name: Test - PHP ${{ matrix.php }}
    runs-on: ubuntu-x64
    if: github.repository_owner == 'sendgrid'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: Checkout sendgrid-php
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Unit Tests
        run: make test-docker version=${{ matrix.php }}

  deploy:
    name: Deploy
    if: success() && github.ref_type == 'tag' && github.repository_owner == 'sendgrid'
    needs: [ test ]
    runs-on: ubuntu-x64
    environment:
      name: production
      url: https://packagist.org/packages/sendgrid/sendgrid
    permissions:
      contents: write          # required for creating GitHub Release
      id-token: write
    steps:
      - name: Checkout sendgrid-php
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release action verifies refs/tags/<tag> in the local clone.
          fetch-depth: 0

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e # v1
        with:
          ecosystem: php

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: gmp

      - name: Build Release Artifacts
        run: make bundle

      - name: Create GitHub Release
        uses: twilio/sdk-actions/github-release@9b1c3222c9ffe38aadedb11c5b9f5a172b5e9951 # v1
        with:
          changelog-file: CHANGELOG.md
          assets: sendgrid-php.zip

#      - name: Submit metric to Datadog
